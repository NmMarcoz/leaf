name: Release

# Three ways in:
#
#   1. Run this workflow and give it a version (e.g. 1.4.1). CI bumps the version
#      files, commits, tags, builds and publishes. Nothing to do locally.
#   2. Push a `v*` tag yourself. CI builds and publishes that tag.
#   3. Run this workflow with no version. Builds both installers and attaches
#      them as workflow artifacts, without tagging or releasing anything — the
#      way to check a CI change without spending a version number.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.4.1. Leave empty to build only."
        required: false
        default: ""

# Needed to push the version bump and the tag, and to create the release.
permissions:
  contents: write

jobs:
  # Run before anything is tagged. Publishing is automatic, so a broken commit
  # must never reach a tag: recovering means deleting a pushed tag and a release
  # that users' updaters may already have seen.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace includes the Tauri app, and on Linux Tauri links against
      # the system GTK/WebKit stack. macOS and Windows use their native webviews
      # and need none of this, which is why only this job wants it.
      - name: Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # vite build (rolldown) needs Node 20.12+.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: check
          # A failing run is exactly when CI gets re-run several times in a
          # row. Without this each retry starts cold, and a cold run is the
          # 45-minute one.
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - run: cargo test --workspace
      - run: bun run build
      - run: cargo clippy --all-targets -- -D warnings

  # Turns a version number into a commit and a tag.
  #
  # This deliberately does the tagging in the *same* run that builds, rather than
  # tagging and letting the push trigger a second run: a tag pushed with
  # GITHUB_TOKEN does not trigger another workflow, so that second run would
  # never happen and the release would silently never appear.
  prepare:
    needs: [check]
    if: inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Tags are not fetched by default, and without them the "already
          # exists" check below silently passes for a version already released.
          fetch-depth: 0
          fetch-tags: true

      - name: Bump, commit and tag
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a three-part version like 1.4.1."
            echo "Tauri's config and the Windows MSI bundler both require major.minor.patch."
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

          # tauri.conf.json is the version the app reports and the updater
          # compares against; Cargo.toml keeps the crates in step.
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/conf.json
          mv /tmp/conf.json src-tauri/tauri.conf.json
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          # Refresh only the workspace members' own versions in the lockfile.
          cargo update --workspace

          # Cheap insurance: the two files and the tag must agree, or the
          # updater will offer one version and install another.
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$conf" != "$VERSION" ] || [ "$crate" != "$VERSION" ]; then
            echo "::error::bump failed — tauri.conf.json=$conf Cargo.toml=$crate wanted=$VERSION"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json Cargo.toml Cargo.lock
          git commit -m "chore: version $VERSION"
          git tag -a "v$VERSION" -m "Leaf $VERSION"
          git push origin main
          git push origin "v$VERSION"

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # For a tag pushed by hand, the tag and tauri.conf.json must already agree.
  # The prepare job makes them agree by construction, so this only guards path 2.
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match tauri.conf.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $conf"
            echo "Either bump the file and re-tag, or run this workflow with a version instead."
            exit 1
          fi
          echo "version $conf matches tag $GITHUB_REF_NAME"

  # Makes the release once, before any platform builds, so nothing downstream
  # ever has to decide whether to create it.
  #
  # The platforms used to run one at a time because tauri-action creates the
  # release when it cannot find one: run together, two runners both found
  # nothing and both created one (v1.8.0, 0.7s apart — two releases on one tag,
  # half the installers on each). With the release made here first, that race
  # is gone, and the builds below run side by side.
  #
  # A draft, not published: the updater reads the latest *published* release,
  # and publishing before every platform has uploaded means installed copies
  # see a `latest.json` that does not name them yet. `publish` flips it once
  # everything is there.
  #
  # Skipped on a build-only run, which is how the jobs below know to upload
  # nothing.
  create-release:
    needs: [check, prepare, check-version]
    if: |
      always()
      && needs.check.result == 'success'
      && needs.prepare.result != 'failure'
      && needs.check-version.result != 'failure'
      && (needs.prepare.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Create the draft (or reuse it on a re-run)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Looked up by listing, not by `releases/tags/…`: that endpoint does
          # not see drafts, and a re-run of a failed release must find the
          # draft it left rather than making a second one beside it.
          release_id() {
            # sed, not head: head exits early and pipefail would count the
            # SIGPIPE it sends gh as a failure.
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | sed -n 1p
          }
          id=$(release_id)
          if [ -z "$id" ]; then
            # What's new first: it is what the update card in the app shows,
            # and on Android the card reads the release body itself.
            { cat .github/whats-new.md; echo; cat .github/release-notes.md; } > "$RUNNER_TEMP/body.md"
            # The id comes from the create response itself. Listing right
            # after creating does not see the new draft yet — v1.1.0's first
            # run made one and then reported it missing.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Leaf $TAG" -F draft=true \
              -F body=@"$RUNNER_TEMP/body.md" --jq .id)
          else
            echo "release for $TAG already exists ($id); reusing it"
          fi
          if [ -z "$id" ]; then
            echo "::error::created the release for $TAG but cannot find it"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, prepare, check-version, create-release]
    # `prepare`, `check-version` and `create-release` are each skipped on the
    # paths they do not apply to, so the build runs unless one of them actually
    # failed. `check` always runs and must pass.
    if: |
      always()
      && needs.check.result == 'success'
      && needs.prepare.result != 'failure'
      && needs.check-version.result != 'failure'
      && needs.create-release.result != 'failure'

    strategy:
      fail-fast: false
      # No max-parallel. The two things that once made parallel builds unsafe
      # are both handled elsewhere: `create-release` makes the release up front,
      # and `publish` writes `latest.json` once at the end instead of each
      # runner merging into it (which lost whichever platform wrote first).
      matrix:
        include:
          # One universal binary rather than separate Intel and Apple Silicon
          # downloads: slightly larger, but nobody has to know which they need.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # `targets: "all"` in tauri.conf.json gets both the .msi and the NSIS
          # .exe here. The .exe is what the updater uses; see updaterJsonPreferNsis.
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # One Linux build covers every distribution: `targets: "all"` bundles
          # .deb (Debian/Ubuntu/Mint), .rpm (Fedora/openSUSE/RHEL) and the
          # AppImage (everything else, including Arch). Built on 22.04 rather
          # than the newer runners because Tauri's docs want the oldest glibc
          # you intend to support — a binary linked against 2.35 runs on every
          # distro since, one linked against 2.39 breaks the older ones. The
          # .rpm needs rpmbuild, hence rpm-build in the apt step.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # When prepare ran, build the tag it just created rather than whatever
          # main pointed at when this run started.
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vite build (rolldown) needs Node 20.12+.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Same stack the `check` job installs so the webview links, plus what the
      # Linux bundlers alone need: rpm-build for the .rpm (rpmbuild is NOT on
      # Debian runners by default) and patchelf for the AppImage.
      - name: Linux bundler dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            rpm-build

      # Tauri's dependency tree is large; without this every release build
      # compiles it from scratch on both runners.
      #
      # `src-tauri` is a member of the root Cargo workspace, so the target dir is
      # at the repo root and NOT inside src-tauri. Pointing this at the wrong
      # place silently caches nothing.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      # No `cargo test` here: it is a debug build that shares nothing with the
      # release build after it, and on a cold cache it was over half of each
      # runner's time. The per-platform tests are the `test` job now, running
      # beside this one and gating `publish`.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts so an installed app will only accept an
          # update that came from this key. Unrelated to OS code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing and notarisation ---
          # Without these the app installs but Gatekeeper warns on first launch.
          # Uncomment together once an Apple Developer account is set up.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # The draft `create-release` made, by id: drafts cannot be found by
          # tag. Empty on a build-only run, which makes tauri-action build
          # without touching any release.
          releaseId: ${{ needs.create-release.outputs.id }}
          # `publish` writes it once, from every platform's signature. Letting
          # each runner merge into it is the race that kept these serialised.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Only useful for the build-without-releasing path; on a release the
      # installers are already attached to the release itself.
      - name: Upload installers as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Leaf-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage

  # The per-platform tests that used to run inside each build. File naming and
  # path handling are where this codebase differs across operating systems, and
  # `check` only covers Linux — so they stay, but beside the builds instead of
  # in front of them. They gate `publish`, not the tag: a failure here leaves a
  # draft nobody sees rather than a release.
  test:
    needs: [check, prepare, check-version]
    if: |
      always()
      && needs.check.result == 'success'
      && needs.prepare.result != 'failure'
      && needs.check-version.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: test-${{ matrix.platform }}
          cache-on-failure: true
      - run: cargo test --workspace

  # Android is a separate job rather than another entry in the build matrix:
  # tauri-action knows nothing about APKs, the signing is ours, and the runner
  # needs a JDK and an NDK that no desktop platform wants.
  android:
    # Beside the desktop builds, not after them. It used to wait so that
    # tauri-action had created the release (with its notes) before the APK was
    # attached; `create-release` does that up front now.
    needs: [check, prepare, check-version, create-release]
    if: |
      always()
      && needs.check.result == 'success'
      && needs.prepare.result != 'failure'
      && needs.check-version.result != 'failure'
      && needs.create-release.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vite build (rolldown) needs Node 20.12+.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The Android Gradle Plugin this project generates needs 17 or newer, and
      # the runner's default has been older than that before now.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 only. Every phone sold in years is arm64, and building the
          # other three would triple the time for an APK almost nobody installs.
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android
          cache-on-failure: true

      # The runner image ships several NDKs. Picking the newest rather than
      # pinning one means this does not break when the image is updated.
      - name: Locate the NDK
        run: |
          set -euo pipefail
          ndk=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          if [ -z "$ndk" ]; then
            echo "::error::no NDK in $ANDROID_HOME/ndk"
            exit 1
          fi
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "using $ndk"

      - run: bun install --frozen-lockfile

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "Add it with: base64 -i release.jks | gh secret set ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The same script used locally, so a CI build and a developer's build go
      # through one path and cannot drift apart in how they are signed.
      - name: Build and sign
        env:
          LEAF_KEYSTORE: ${{ runner.temp }}/release.jks
          LEAF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEAF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Nothing to read here; the credentials above are the whole of it.
          LEAF_KEYSTORE_PROPERTIES: /nonexistent
        run: scripts/android.sh

      - name: Name it after the version
        id: apk
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          out="target/Leaf_${version}_arm64.apk"
          mv target/leaf-release.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # Attached to the draft `create-release` made; `gh release upload`
      # resolves a draft by its pending tag.
      # `gh` rather than an action that wraps it: softprops/action-gh-release
      # takes the tag it updates from `github.ref`, which on a workflow_dispatch
      # run is `refs/heads/main` and not a tag at all, so it found the release
      # and then failed trying to rename it to a branch.
      - name: Attach to the release
        if: ${{ needs.create-release.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: gh release upload "$TAG" "$APK" --clobber

      - name: Upload the APK as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Leaf-android
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.apk.outputs.path }}

  # The only job that makes a release visible. It runs once everything else
  # has succeeded, writes `latest.json` from the signatures all the platforms
  # uploaded, and only then takes the release out of draft — so installed
  # copies never see a release that is missing their platform.
  #
  # tauri-action used to write `latest.json` itself, each runner merging its
  # own platform in. `scripts/latest-json.py` produces the same file (checked
  # against v1.0.0's), once, which is what lets the builds run in parallel.
  publish:
    needs: [create-release, build, android, test]
    if: |
      always()
      && needs.create-release.result == 'success'
      && needs.build.result == 'success'
      && needs.android.result == 'success'
      && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Write latest.json and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/updater"
          mkdir -p "$work/sigs"
          gh release download "$TAG" -p '*.sig' -D "$work/sigs"
          # Only what's new, not the download instructions: these notes are
          # what the desktop update card shows, to someone who already has
          # the app installed.
          python3 scripts/latest-json.py \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes .github/whats-new.md --out "$work/latest.json" \
            "$work"/sigs/*.sig

          # Every desktop platform must be in it. A platform missing here would
          # otherwise publish fine and silently never update.
          for key in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            if ! jq -e --arg k "$key" '.platforms | has($k)' "$work/latest.json" >/dev/null; then
              echo "::error::latest.json has no $key entry"
              exit 1
            fi
          done

          gh release upload "$TAG" "$work/latest.json" --clobber
          gh release edit "$TAG" --draft=false --latest
